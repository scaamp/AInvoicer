name: Offline security and smoke build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    # Pin obrazu: ubuntu-latest przeszedł na26.04; kontrolowany baseline toolingu UI5/Chrome.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AINV_KSEF_ENABLED: 'false'
      AINV_SAP_WRITE_ENABLED: 'false'
      AINV_H01_LIVE_WRITE: 'false'
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Weryfikacja Chrome/CDP przed kosztownym buildem SDK/CAP; testy nadal sprawdzają CSP i redirecty.
      - name: Browser security runner preflight
        run: |
          npm ci --prefix sapui5/ainvoicer
          npm run test:runner --prefix sapui5/ainvoicer
      - uses: actions/setup-java@v4
        id: java21
        with:
          distribution: temurin
          java-version: '21'
      # Publiczny SDK ze sprawdzonym SHA; bez GitHub Packages i bez PAT.
      - name: Install pinned MF SDK (build only, no KSeF API)
        shell: pwsh
        run: ./cap-java/tools/Install-KsefSdk.ps1 -SourceDirectory "$env:RUNNER_TEMP/ksef-sdk" -Jdk21 '${{ steps.java21.outputs.path }}'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Maven 3.9.16 with Apache checksum
        shell: bash
        run: |
          set -euo pipefail
          base=https://archive.apache.org/dist/maven/maven-3/3.9.16/binaries
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error -O "$base/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --silent --show-error -O "$base/apache-maven-3.9.16-bin.tar.gz.sha512"
          printf '%s  %s\n' "$(cat apache-maven-3.9.16-bin.tar.gz.sha512)" apache-maven-3.9.16-bin.tar.gz | sha512sum -c -
          tar -xzf apache-maven-3.9.16-bin.tar.gz
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      # Niezależny czytnik ZIP wykrywa Windows creator=10 -> mode000 przed buildem/deploymentem.
      # Narzędzie wyłącznie testowe, bez nowego runtime ani zależności aplikacji.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Deployment invariants and secret patterns
        run: |
          npm ci --prefix deploy
          npm test --prefix deploy
          npm run validate:smoke --prefix deploy
          node deploy/scripts/check-secrets.mjs
      # W środku: Maven clean verify (CDS/JWT/startup/writeback mock), UI5 CF i AppRouter.
      - name: Build and validate undeployed identity-smoke MTAR
        run: npm run build:btp:smoke --prefix deploy
      - name: Build and validate undeployed HANA readiness MTAR (no credentials or CF)
        run: |
          npm run build:btp:hana --prefix deploy
          npm run verify:hana --prefix deploy
      - name: Package isolated HANA test runner and exercise offline gates (no HANA or CF)
        run: |
          node deploy/scripts/hana-it-runner.mjs build
          node deploy/scripts/hana-it-runner.mjs test
      - name: Official Azure storage emulator contract (loopback only)
        run: |
          npm ci --prefix deploy/storage --ignore-scripts
          npm test --prefix deploy/storage
      - name: UI5 development build
        working-directory: sapui5/ainvoicer
        run: |
          npm run build
      - name: QUnit and OPA with local mock server
        working-directory: sapui5/ainvoicer
        shell: bash
        run: |
          set -euo pipefail
          npm run serve-mock > "$RUNNER_TEMP/ui5-mock.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8085/test/unit/unitTests.qunit.html > /dev/null; then ready=true; break; fi
            sleep 1
          done
          test "$ready" = true
          npm test
      - name: Inbox against actual local CAP HTTP (A/B, access failures and restart)
        run: npm run test:inbox:e2e --prefix sapui5/ainvoicer
      - name: Whitespace check
        run: git diff --check
