# AInvoicer — deskryptor MTA (CAP-07). PRZYGOTOWANIE, NIE WDROŻONO.
# Nie uruchamiać `cf deploy` / `cf push` / `cf create-service` bez osobnego upoważnienia (docs/guides/BTP_IDENTITY_SETUP.md).
# Wartości oznaczone TO VERIFY wymagają potwierdzenia w docelowym subaccount przed CAP-07B.
_schema-version: "3.1"
ID: ainvoicer
version: 0.7.0
description: AInvoicer — SAPUI5 + CAP Java (KSeF integration) + SAP RAP UI, single-tenant

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci --prefix sapui5/ainvoicer
        - npm run build --prefix sapui5/ainvoicer

modules:
  # CAP Java + Spring Boot. Profil cf: mock auth OFF, CloudIdentityGuard wymaga dokładnie jednego bindingu XSUAA.
  - name: ainvoicer-srv
    type: java
    path: cap-java/srv
    build-parameters:
      builder: custom
      commands:
        - mvn -f ../pom.xml clean package -DskipTests=true -Dcds.cds.skipVersionCheck=true
      build-result: target/*-exec.jar
    parameters:
      buildpack: sap_java_buildpack_jakarta
      memory: 1024M
      disk-quota: 1024M
      # Bez sprawdzania HTTP: endpointy CAP wymagają tokenu.
      health-check-type: port
    properties:
      SPRING_PROFILES_ACTIVE: cf
      # TO VERIFY: dostępność SapMachine 25 w sap_java_buildpack_jakarta danego landscape (projekt wymaga JDK 25).
      JBP_CONFIG_COMPONENTS: "jres: ['com.sap.xs.java.buildpack.jre.SAPMachineJRE']"
      JBP_CONFIG_SAP_MACHINE_JRE: "{ version: 25.+ }"
      # BLOCKER CAP-07B: profil cf nie ma trwałej bazy. H2 na CF jest niezgodne z AGENTS.md;
      # wymagana decyzja właściciela: SAP HANA Cloud (entitlement) albo jawny wyjątek dla smoke testu tożsamości.
    requires:
      - name: ainvoicer-auth
      - name: ainvoicer-destination
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}

  # SAP Application Router: SAPUI5 (statycznie z resources/), CAP przez token użytkownika, RAP przez business-user Destination.
  - name: ainvoicer-approuter
    type: approuter.nodejs
    path: approuter
    build-parameters:
      builder: custom
      commands:
        - npm ci --omit=dev
        - node -e "require('fs').cpSync('../sapui5/ainvoicer/dist','resources',{recursive:true})"
    parameters:
      memory: 256M
      disk-quota: 512M
      keep-existing-routes: true
    properties:
      SESSION_TIMEOUT: 15
      destinations:
        - name: ainvoicer-cap
          url: ~{srv-url}
          forwardAuthToken: true
        - name: ui5
          url: https://ui5.sap.com
    requires:
      - name: srv-api
      - name: ainvoicer-auth
      # Destination Service: AINV_H01_UI_USER (business-user SSO do H01) tworzy administrator w subaccount.
      - name: ainvoicer-destination

resources:
  # XSUAA plan application, single-tenant; deskryptor zweryfikowany testem XsSecurityDescriptorTest.
  - name: ainvoicer-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./cap-java/xs-security.json
      config:
        xsappname: ainvoicer-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          redirect-uris:
            - https://*.${default-domain}/**

  # Destination Service plan lite: AINV_H01 (CAP -> Web API, communication user) i AINV_H01_UI_USER
  # (approuter -> RAP UI, propagacja business usera). Obie konfiguruje administrator; brak sekretów w repo.
  - name: ainvoicer-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
