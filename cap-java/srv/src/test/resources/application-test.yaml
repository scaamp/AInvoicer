spring:
  sql.init.platform: h2
  datasource:
    url: "jdbc:h2:mem:capjava;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
cds:
  data-source.auto-config.enabled: false
  security:
    mock:
      defaultUsers:
        enabled: false
      users:
        - name: operator-a
          password: test-a
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
            companyCodes: ["1000"]
        - name: operator-b
          password: test-b
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["9876543210"]
            companyCodes: ["2000"]
        - name: operator-other-company
          password: test-cc
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
            companyCodes: ["2000"]
        - name: operator-peer
          password: test-peer
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
            companyCodes: ["1000"]
        - name: user-without-ksef-role
          password: test-user
          roles: [authenticated-user]
          attributes:
            taxpayerNips: ["1234567802"]
        - name: operator-without-taxpayer-attribute
          password: test-no-nip
          roles: [KsefOperator]
ainv:
  sap-write:
    # Testy wywołują sweep() jawnie; tło nie może tworzyć zleceń w trakcie asercji innych testów.
    sweeper:
      enabled: false
