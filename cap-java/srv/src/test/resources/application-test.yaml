spring:
  sql.init.platform: h2
  datasource:
    url: "jdbc:h2:mem:capjava;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
cds:
  data-source.auto-config.enabled: false
  security:
    mock:
      defaultUsers:
        enabled: false
      users:
        - name: operator-a
          password: test-a
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
            companyCodes: ["1000"]
        - name: operator-b
          password: test-b
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["9876543210"]
            companyCodes: ["2000"]
        - name: operator-other-company
          password: test-cc
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
            companyCodes: ["2000"]
        - name: operator-peer
          password: test-peer
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
            companyCodes: ["1000"]
        - name: user-without-ksef-role
          password: test-user
          roles: [authenticated-user]
          attributes:
            taxpayerNips: ["1234567802"]
        - name: operator-without-taxpayer-attribute
          password: test-no-nip
          roles: [KsefOperator]
        - name: operator-without-company-attribute
          password: test-no-cc
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
        # CAP-07: dwie role (1234567802/1000 + 9876543210/2000) scalone w dwie listy — pary niejednoznaczne.
        - name: operator-cross-scope
          password: test-cross
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802", "9876543210"]
            companyCodes: ["1000", "2000"]
        # CAP-07: jeden NIP i dwie spółki — iloczyn list jest dokładnie zbiorem przyznanych par.
        - name: operator-one-nip-two-companies
          password: test-one-nip
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["1234567802"]
            companyCodes: ["1000", "2000"]
        - name: operator-malformed-scope
          password: test-malformed
          roles: [KsefOperator]
          attributes:
            taxpayerNips: ["invalid", ""]
            companyCodes: ["1000"]
ainv:
  sap-write:
    # Testy wywołują sweep() jawnie; tło nie może tworzyć zleceń w trakcie asercji innych testów.
    sweeper:
      enabled: false
