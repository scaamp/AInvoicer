
---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
  datasource:
    url: "jdbc:h2:mem:capjava;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2.console:
    enabled: true
    path: /h2-console
    settings.web-allow-others: false
cds:
  data-source.auto-config.enabled: false
---
# Bez profilu: Remote Service H01 obowiązuje w każdym środowisku (default, test, live, cf).
# Destination AINV_H01 jest dostarczane przez środowisko (zmienna `destinations` lokalnie, BTP Destination Service na CF).
cds:
  outbox:
    services:
      KsefSubmissionOutbox:
        maxAttempts: 50
      SapResultOutbox:
        # Limit CAP jest celowo wyższy niż ainv.sap-write.max-attempts: budżet prób HTTP liczy
        # i egzekwuje aplikacja (stan RETRY_EXHAUSTED), a CAP-owi zostaje margines na dostarczenia
        # bez wywołania SAP (np. aktywna dzierżawa innego workera).
        maxAttempts: 12
  remote.services:
    AinvoicerH01:
      model: com.sap.gateway.srvd_a2x.zapi_ainv_inv_h_o4.v0001
      type: odata-v4
      destination:
        name: AINV_H01
      http:
        csrf.enabled: true
        # Destination URL wskazuje wyłącznie origin H01. Pełna ścieżka usługi (z aktywnego bindingu) trafia do
        # `service` - pusty `service` jest ignorowany i CAP dokłada nazwę serwisu CDS do URL.
        service: sap/opu/odata4/sap/zapi_ainv_inv_h_o4/srvd_a2x/sap/zapi_ainv_inv_h_o4/0001
ainv:
  ksef:
    enabled: false
    nip: ${AINV_KSEF_NIP:}
    token: ${AINV_KSEF_TOKEN:}
    test-xades: false
    local-store: ${AINV_KSEF_LOCAL_STORE:}
    # Jawna polityka requestSend (ADR-0005): nowa próba wyłącznie po potwierdzonym, zamkniętym
    # odrzuceniu przez KSeF, nigdy po RECONCILIATION_REQUIRED ani możliwym duplikacie (440).
    send:
      retry-after-rejection: true
      max-attempts: 3
    # Dane FA(3) spoza RAP (adresy, JST/GV) per NIP; puste = requestSend zwraca KSEF_PARTY_DATA_MISSING.
    # Przykład: party-data.sellers."1234563218": { country-code: PL, line1: "ul. Testowa 1", line2: "00-001 Warszawa" }
    #           party-data.buyers."<NIP>": { country-code: PL, line1: "...", jst-subordinate-unit: false, vat-group-member: false }
    party-data:
      sellers: {}
      buyers: {}
  sap-write:
    # Włączenie rzeczywistego HTTP WRITE dopiero w odrębnie zatwierdzonym CAP-04D.
    enabled: false
    # Czas ważności przejęcia polecenia. Po restarcie lub zawieszeniu workera polecenie jest odzyskiwane
    # dopiero po tym terminie; ponowne wywołanie SAP jest bezpieczne dzięki stałemu WriteRequestId.
    lease: PT2M
    # Socket timeout nie ogranicza DNS, auth, CSRF i całego strumienia odpowiedzi.
    # Odnowienie ważnego claimu obejmuje całe adapter.apply, bez trzymania transakcji podczas HTTP.
    renew-interval: PT20S
    http:
      connect-timeout: PT5S
      read-timeout: PT20S
      pool-timeout: PT5S
    # Liczba prób HTTP przed RETRY_EXHAUSTED (licznik zerowany kontrolowanym wznowieniem).
    max-attempts: 5
    # Po tym czasie PENDING bez postępu jest zgłaszany jako osierocony.
    stale-after: PT10M
    # Odtwarzanie brakujących zleceń: ACCEPTED (migawka SAP_RAP) bez SapResultWrites. Przy starcie i okresowo.
    sweeper:
      enabled: true
      interval: PT5M
      batch-size: 50
logging:
  level:
    # CAP 5.2 loguje tu surowe body błędów zdalnych. Zostawiamy tylko nasze bezpieczne kody.
    com.sap.cds.services.impl.odata.RemoteODataClient.errors: "OFF"
