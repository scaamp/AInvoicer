
---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
  datasource:
    url: "jdbc:h2:mem:capjava;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2.console:
    enabled: true
    path: /h2-console
    settings.web-allow-others: false
cds:
  data-source.auto-config.enabled: false
  remote.services:
    AinvoicerH01:
      model: AinvoicerH01
      type: odata-v4
      destination:
        name: AINV_H01
      http:
        # Destination URL wskazuje origin H01; ścieżka została odczytana z aktywnego bindingu.
        suffix: /sap/opu/odata4/sap/zapi_ainv_inv_h_o4/srvd_a2x/sap/zapi_ainv_inv_h_o4/0001/
        service: ""
