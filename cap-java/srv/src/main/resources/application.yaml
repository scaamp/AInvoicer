
---
spring:
  config.activate.on-profile: default
  sql.init.platform: h2
  datasource:
    url: "jdbc:h2:mem:capjava;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2.console:
    enabled: true
    path: /h2-console
    settings.web-allow-others: false
cds:
  data-source.auto-config.enabled: false
---
# Bez profilu: Remote Service H01 obowiązuje w każdym środowisku (default, test, live, cf).
# Destination AINV_H01 jest dostarczane przez środowisko (zmienna `destinations` lokalnie, BTP Destination Service na CF).
cds:
  outbox:
    services:
      SapResultOutbox:
        maxAttempts: 5
  remote.services:
    AinvoicerH01:
      model: com.sap.gateway.srvd_a2x.zapi_ainv_inv_h_o4.v0001
      type: odata-v4
      destination:
        name: AINV_H01
      http:
        csrf.enabled: true
        # Destination URL wskazuje wyłącznie origin H01. Pełna ścieżka usługi (z aktywnego bindingu) trafia do
        # `service` - pusty `service` jest ignorowany i CAP dokłada nazwę serwisu CDS do URL.
        service: sap/opu/odata4/sap/zapi_ainv_inv_h_o4/srvd_a2x/sap/zapi_ainv_inv_h_o4/0001
ainv:
  sap-write:
    # Włączenie rzeczywistego HTTP WRITE dopiero w odrębnie zatwierdzonym CAP-04D.
    enabled: false
logging:
  level:
    # CAP 5.2 loguje tu surowe body błędów zdalnych. Zostawiamy tylko nasze bezpieczne kody.
    com.sap.cds.services.impl.odata.RemoteODataClient.errors: "OFF"
