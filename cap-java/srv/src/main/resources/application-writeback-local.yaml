# Opcjonalna lokalna persystencja do testów restartu; transport SAP pozostaje wyłączony.
# Pierwsze uruchomienie pustej bazy wymaga jednorazowego --spring.sql.init.mode=always.
# Kolejne uruchomienia nie odtwarzają schematu i zachowują kolejkę/historię.
spring:
  sql.init:
    platform: h2
    mode: never
  datasource:
    url: "jdbc:h2:file:./.local/ainv-writeback;DB_CLOSE_ON_EXIT=FALSE"
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
cds:
  data-source.auto-config.enabled: false
server:
  address: 127.0.0.1
