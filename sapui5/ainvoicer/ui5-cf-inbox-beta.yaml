# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# BETA-01: wyłącznie build opt-in wariantu KSeF Inbox beta (`npm run build:cf:inbox-beta`), bez serwera i proxy.
# Źródło build/cf-inbox-beta-webapp przygotowuje scripts/build-cf.mjs --variant=inbox-beta (kopia webapp bez test/
# i localService/, kokpit rap + capabilities OFF, Inbox read-only CAP). Katalog jest ignorowany przez Git.
specVersion: "3.1"
metadata:
  name: ainvoicer
type: application
resources:
  configuration:
    paths:
      webapp: build/cf-inbox-beta-webapp
